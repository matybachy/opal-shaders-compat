modLoader="javafml"
loaderVersion="[4,)"
license="LGPL-3.0-only"

[[mods]]
modId="vitrailbridge"
version="${version}"
displayName="Vitrail Bridge"
authors="matyb"
description='''
Client-side glue between VulkanMod Reforged, Vitrail VK, Opal Shaders and Vectors: on Vulkan the packs run on Vitrail VK and Opal's OpenGL renderer stands down, the settings of all of them are on one screen, and on OpenGL Opal takes packs with more than seven custom images and Flywheel gets out of its way.
'''

[[mixins]]
config="vitrailbridge.mixins.json"

[[dependencies.vitrailbridge]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.vitrailbridge]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.vitrailbridge]]
    modId="vulkanmod"
    type="optional"
    versionRange="[${vulkanmod_version}]"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.vitrailbridge]]
    modId="vitrailvk"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.vitrailbridge]]
    modId="opal"
    type="optional"
    versionRange="[1.0.0-alpha.8,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.vitrailbridge]]
    modId="vectors"
    type="optional"
    versionRange="[1.5.0,)"
    ordering="AFTER"
    side="CLIENT"
